<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="45" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CORP-01-CV | TRI-MODEL OFFICIAL BENCHMARK MATRIX (TEST SET: 1,262 CASES)</text>
  <text x="60" y="80" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Ma Trận Đối Đầu Toàn Diện: Baseline vs ResNet-50 vs ConvNeXt vs Swin-T</text>

  <!-- Table Container Card -->
  <g transform="translate(60, 105)">
    <rect width="1080" height="490" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Highlight Champion Column Box -->
    <rect x="670" y="48" width="230" height="430" fill="#ecfdf5" fill-opacity="0.6" stroke="#059669" stroke-width="2" rx="6" />

    <!-- Table Header Row -->
    <rect x="0" y="0" width="1080" height="50" rx="10" fill="#f0f9ff" />
    <text x="25" y="32" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">TIÊU CHÍ ĐÁNH GIÁ</text>
    <text x="260" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">BASELINE (RESNET)</text>
    <text x="470" y="32" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">M1: RESNET-50 (FiLM)</text>
    <text x="690" y="32" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">🏆 M2: CONVNEXT (FiLM)</text>
    <text x="940" y="32" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">M3: SWIN-T (FiLM)</text>

    <!-- Row 1: Trường phái -->
    <g transform="translate(0, 50)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Trường phái kiến trúc</text>
      <text x="260" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">CNN cổ điển (2015)</text>
      <text x="470" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Residual CNN + FiLM</text>
      <text x="690" y="27" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Modern Pure CNN (7×7)</text>
      <text x="940" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Vision Transformer</text>
    </g>

    <!-- Row 2: Tham số & Checkpoint -->
    <g transform="translate(0, 92)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Tham số &amp; Dung lượng</text>
      <text x="260" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">25.6M (98.4 MB)</text>
      <text x="470" y="27" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">28.3M (Gọn nhất)</text>
      <text x="690" y="27" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="12">29.8M (341.2 MB)</text>
      <text x="940" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">29.5M (338.0 MB)</text>
    </g>

    <!-- Row 3: Test MAE (The Crown Jewel Metric) -->
    <g transform="translate(0, 134)">
      <rect x="15" y="4" width="1050" height="42" fill="#ecfdf5" rx="4" />
      <line x1="20" y1="44" x2="1060" y2="44" stroke="#bae6fd" />
      <text x="25" y="32" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">TEST MAE (Tháng)</text>
      <text x="260" y="32" fill="#64748b" font-family="'Courier New', monospace" font-size="14">7.38 m</text>
      <text x="470" y="32" fill="#0284c7" font-family="'Courier New', monospace" font-size="14" font-weight="700">6.47 m (-12.3%)</text>
      <text x="690" y="32" fill="#059669" font-family="'Courier New', monospace" font-size="16" font-weight="800">6.26 m (-15.2%) 🏆</text>
      <text x="940" y="32" fill="#4f46e5" font-family="'Courier New', monospace" font-size="14" font-weight="700">6.37 m (Á quân)</text>
    </g>

    <!-- Row 4: Test RMSE -->
    <g transform="translate(0, 180)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">TEST RMSE (Tháng)</text>
      <text x="260" y="27" fill="#64748b" font-family="'Courier New', monospace" font-size="13">9.60 m</text>
      <text x="470" y="27" fill="#334155" font-family="'Courier New', monospace" font-size="13">8.70 m</text>
      <text x="690" y="27" fill="#059669" font-family="'Courier New', monospace" font-size="14" font-weight="700">8.40 m (Thấp nhất)</text>
      <text x="940" y="27" fill="#334155" font-family="'Courier New', monospace" font-size="13">8.62 m</text>
    </g>

    <!-- Row 5: R2 Score -->
    <g transform="translate(0, 222)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Hệ số xác định R²</text>
      <text x="260" y="27" fill="#64748b" font-family="'Courier New', monospace" font-size="13">0.9452 (94.5%)</text>
      <text x="470" y="27" fill="#334155" font-family="'Courier New', monospace" font-size="13">0.9540 (95.4%)</text>
      <text x="690" y="27" fill="#059669" font-family="'Courier New', monospace" font-size="14" font-weight="700">0.9571 (95.71%) ★</text>
      <text x="940" y="27" fill="#334155" font-family="'Courier New', monospace" font-size="13">0.9549 (95.5%)</text>
    </g>

    <!-- Row 6: Accuracy <= 6m -->
    <g transform="translate(0, 264)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Chính xác ≤ 6 tháng</text>
      <text x="260" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">51.5%</text>
      <text x="470" y="27" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">59.7% (Cao nhất) ★</text>
      <text x="690" y="27" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">59.2%</text>
      <text x="940" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="13">58.7%</text>
    </g>

    <!-- Row 7: Clinical Safety <= 12m -->
    <g transform="translate(0, 306)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">An toàn AAP ≤ 12 tháng</text>
      <text x="260" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">81.38%</text>
      <text x="470" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="13">84.70%</text>
      <text x="690" y="27" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">86.50% (Cao nhất) ★</text>
      <text x="940" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="13">86.00%</text>
    </g>

    <!-- Row 8: Inference Speed (FPS) -->
    <g transform="translate(0, 348)">
      <line x1="20" y1="40" x2="1060" y2="40" stroke="#e2e8f0" />
      <text x="25" y="27" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Thông lượng (GPU / CPU)</text>
      <text x="260" y="27" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">67.5 FPS / 1.1</text>
      <text x="470" y="27" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">67.5 FPS / 1.1</text>
      <text x="690" y="27" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">55.0 FPS / 1.3 ★</text>
      <text x="940" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">37.7 FPS / 0.9</text>
    </g>

    <!-- Row 9: Ranking -->
    <g transform="translate(0, 395)">
      <rect x="15" y="5" width="1050" height="40" fill="#f0f9ff" rx="4" />
      <text x="25" y="32" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">XẾP HẠNG CHUNG CUỘC</text>
      <text x="260" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">Mô hình Đối chứng</text>
      <text x="470" y="32" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Hạng Ba (Tiết kiệm lỗi -12%)</text>
      <text x="690" y="32" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">🏆 QUÁN QUÂN TOÀN DIỆN</text>
      <text x="940" y="32" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">🥈 Á QUÂN XUẤT SẮC</text>
    </g>

    <!-- Bottom summary line -->
    <text x="540" y="475" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">
      Trích xuất từ tệp nhật ký thực nghiệm <tspan fill="#0284c7" font-weight="600">tri_model_benchmark_table.csv</tspan> trên 1.262 ca bệnh kiểm thử độc lập.
    </text>
  </g>
</svg>
