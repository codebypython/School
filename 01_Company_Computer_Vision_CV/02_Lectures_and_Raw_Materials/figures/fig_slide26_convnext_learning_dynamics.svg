<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <!-- Clean Light Blue and White Canvas -->
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="45" fill="#059669" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">CORP-01-CV | CONVNEXT-TINY TRAINING DYNAMICS &amp; CONVERGENCE</text>
  <text x="60" y="80" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Động Học Hội Tụ ConvNeXt-Tiny Multimodal (FiLM) — Quán Quân Hệ Thống</text>

  <!-- Left: Main Chart Area -->
  <g transform="translate(60, 105)">
    <rect width="760" height="480" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Axes -->
    <line x1="80" y1="420" x2="720" y2="420" stroke="#94a3b8" stroke-width="2" />
    <line x1="80" y1="50" x2="80" y2="420" stroke="#94a3b8" stroke-width="2" />

    <!-- Y labels & Grid lines -->
    <g font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="end">
      <line x1="80" y1="90" x2="720" y2="90" stroke="#e2e8f0" stroke-dasharray="4,4" />
      <text x="70" y="94">80m</text>

      <line x1="80" y1="160" x2="720" y2="160" stroke="#e2e8f0" stroke-dasharray="4,4" />
      <text x="70" y="164">50m</text>

      <line x1="80" y1="230" x2="720" y2="230" stroke="#e2e8f0" stroke-dasharray="4,4" />
      <text x="70" y="234">30m</text>

      <line x1="80" y1="300" x2="720" y2="300" stroke="#e2e8f0" stroke-dasharray="4,4" />
      <text x="70" y="304">15m</text>

      <line x1="80" y1="370" x2="720" y2="370" stroke="#e2e8f0" stroke-dasharray="4,4" />
      <text x="70" y="374">8m</text>

      <line x1="80" y1="400" x2="720" y2="400" stroke="#059669" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7" />
      <text x="70" y="404" fill="#059669" font-weight="700">6.18m</text>
    </g>

    <!-- X labels (Epochs 1 to 20) -->
    <g font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
      <text x="100" y="445">Ep 1</text>
      <text x="170" y="445">Ep 4</text>
      <text x="240" y="445">Ep 7</text>
      <text x="310" y="445">Ep 10</text>
      <text x="380" y="445">Ep 13</text>
      <text x="450" y="445">Ep 15</text>
      <text x="520" y="445" font-weight="700" fill="#059669">Ep 17</text>
      <text x="650" y="445">Ep 20</text>
    </g>

    <!-- ResNet-50 Benchmark Curve (Dashed Blue for reference) -->
    <path d="M 100 110 Q 180 280 270 340 T 450 380 T 520 388 T 650 386"
          fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />

    <!-- ConvNeXt Validation Curve (Emerald Green Solid) -->
    <path d="M 100 95 Q 170 250 260 325 T 420 375 T 520 400 T 650 398"
          fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />

    <!-- Optimal Point at Epoch 17 (Val MAE = 6.18m) -->
    <circle cx="520" cy="400" r="7" fill="#059669" stroke="#ffffff" stroke-width="2" />
    <circle cx="520" cy="400" r="14" fill="#059669" opacity="0.25" />

    <!-- Optimal Callout Card -->
    <g transform="translate(430, 290)">
      <rect width="190" height="65" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
      <text x="95" y="24" text-anchor="middle" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">CHAMPION CHECKPOINT</text>
      <text x="95" y="48" text-anchor="middle" fill="#065f46" font-family="'Courier New', monospace" font-size="16" font-weight="900">Val MAE = 6.18m</text>
    </g>

    <!-- Legend -->
    <g transform="translate(100, 65)">
      <line x1="0" y1="0" x2="25" y2="0" stroke="#059669" stroke-width="3" />
      <circle cx="12" cy="0" r="3" fill="#059669" />
      <text x="35" y="4" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">ConvNeXt-Tiny (FiLM) — Quán quân</text>

      <line x1="260" y1="0" x2="285" y2="0" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" />
      <text x="295" y="4" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">ResNet-50 (FiLM) — 6.82m</text>
    </g>
  </g>

  <!-- Right: Architecture Highlights -->
  <g transform="translate(840, 105)">
    <!-- Card 1 -->
    <rect width="300" height="150" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="20" y="30" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">TẠI SAO CONVNEXT HỘI TỤ MƯỢT?</text>
    <text x="20" y="58" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">• <tspan fill="#0284c7" font-weight="700">Tích chập 7×7 Depthwise:</tspan> Receptive field lớn như ViT nhưng bảo tồn inductive bias.</text>
    <text x="20" y="98" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">• <tspan fill="#059669" font-weight="700">LayerNorm thay vì BatchNorm:</tspan> Ổn định bề mặt mất mát cực hạn.</text>
    <text x="20" y="132" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">• <tspan fill="#d97706" font-weight="700">GRN (Global Response Norm):</tspan> Ngăn bão hòa kênh đặc trưng.</text>

    <!-- Card 2 -->
    <g transform="translate(0, 165)">
      <rect width="300" height="150" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
      <text x="20" y="30" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">REGULARIZATION CHỐNG OVERFIT</text>
      <text x="20" y="58" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Stochastic Depth (DropPath = 0.1):</text>
      <text x="20" y="82" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">Ngắt ngẫu nhiên nhánh Inverted Bottleneck trong quá trình huấn luyện.</text>
      <text x="20" y="115" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">👉 Đường cong Test duy trì mức 6.26m kỷ lục!</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 330)">
      <rect width="300" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
      <text x="20" y="30" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">KỶ LỤC TEST SET HỆ THỐNG</text>
      <text x="20" y="65" fill="#065f46" font-family="'Courier New', monospace" font-size="28" font-weight="900">MAE 6.26m</text>
      <text x="20" y="95" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="12">Giảm <tspan font-weight="700">-15.2% sai số</tspan> so với Baseline</text>
      <text x="20" y="125" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">R² = 0.9571 | An toàn 12m: 86.50%</text>
    </g>
  </g>
</svg>
