<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="45" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CORP-01-CV | CLINICAL DECISION SUPPORT SYSTEM (CDSS) DEMO</text>
  <text x="60" y="80" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Kiến Trúc &amp; Giao Diện WebApp Chẩn Đoán Lâm Sàng Thời Gian Thực (Streamlit)</text>

  <!-- WebApp Browser Frame Mockup -->
  <g transform="translate(60, 105)">
    <rect width="1080" height="490" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="1080" height="35" rx="10" fill="#f1f5f9" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <rect x="180" y="6" width="720" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="540" y="21" text-anchor="middle" fill="#64748b" font-family="'Courier New', monospace" font-size="11">https://pediatric-bone-age.visionlab.dut.ac.vn (Offline Localhost:8501)</text>

    <!-- Sidebar (Left) -->
    <g transform="translate(15, 50)">
      <rect width="250" height="425" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="30" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">⚙️ CẤU HÌNH BỆNH NHI</text>

      <text x="20" y="65" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Chọn Mô Hình AI:</text>
      <rect x="20" y="75" width="210" height="32" rx="4" fill="#ecfdf5" stroke="#059669" />
      <text x="30" y="95" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🏆 M2: ConvNeXt-Tiny (FiLM)</text>

      <text x="20" y="130" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Giới Tính Sinh Học:</text>
      <rect x="20" y="140" width="100" height="28" rx="4" fill="#0284c7" />
      <text x="70" y="158" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Nam (Boy)</text>
      <rect x="130" y="140" width="100" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="180" y="158" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Nữ (Girl)</text>

      <text x="20" y="195" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Tuổi Khai Sinh (Thực tế):</text>
      <rect x="20" y="205" width="210" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="30" y="225" fill="#0f172a" font-family="'Courier New', monospace" font-size="12">120 Tháng (10.0 Tuổi)</text>

      <text x="20" y="265" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Tải ảnh X-quang tay trái:</text>
      <rect x="20" y="275" width="210" height="75" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-dasharray="4,4" />
      <text x="125" y="305" text-anchor="middle" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Kéo thả ảnh tại đây</text>
      <text x="125" y="325" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">Hỗ trợ PNG, JPG, DICOM</text>

      <!-- Action Button -->
      <rect x="20" y="370" width="210" height="40" rx="6" fill="#059669" />
      <text x="125" y="394" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">🚀 CHẨN ĐOÁN TỰ ĐỘNG</text>
    </g>

    <!-- Main Content Area: Image + Results (Right) -->
    <g transform="translate(280, 50)">
      <!-- Left sub-panel: Image & GradCAM -->
      <rect width="360" height="425" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="30" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">🖼️ PHIM X-QUANG &amp; XAI GRAD-CAM</text>

      <g transform="translate(20, 50)">
        <rect width="320" height="240" rx="6" fill="#0f172a" stroke="#cbd5e1" />
        <!-- Hand silhouette mockup -->
        <path d="M 160,220 C 110,220 100,160 115,100 C 120,60 135,50 142,80 C 148,35 160,30 166,80 C 172,45 184,45 185,95 C 190,110 200,120 195,160 C 190,200 180,220 160,220 Z" fill="#334155" />
        <!-- Heat overlay -->
        <circle cx="160" cy="190" r="30" fill="#ef4444" opacity="0.85" />
        <circle cx="160" cy="190" r="45" fill="#f59e0b" opacity="0.4" />
        <!-- XAI focus badge -->
        <rect x="25" y="252" width="270" height="26" rx="4" fill="#ecfdf5" stroke="#86efac" />
        <text x="160" y="269" text-anchor="middle" fill="#047857" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">✓ Vùng tập trung: 8 Xương cổ tay</text>
      </g>

      <!-- Preprocessing badges -->
      <rect x="20" y="340" width="320" height="65" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="30" y="362" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Pipeline xử lý: <tspan fill="#0284c7" font-weight="600">CLAHE + Otsu Crop (512×512)</tspan></text>
      <text x="30" y="385" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Thời gian suy luận: <tspan fill="#059669" font-weight="700">14.8 ms (67.5 FPS)</tspan></text>
    </g>

    <!-- Right sub-panel: Clinical Decision Cards -->
    <g transform="translate(655, 50)">
      <rect width="410" height="425" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="30" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">📊 KẾT QUẢ ĐỊNH LƯỢNG &amp; CẢNH BÁO</text>

      <!-- Metric 1: Predicted Age -->
      <rect x="20" y="50" width="370" height="75" rx="6" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="35" y="75" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">TUỔI XƯƠNG DỰ ĐOÁN (AI):</text>
      <text x="35" y="105" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">133.5 Tháng</text>
      <text x="220" y="105" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="14">(~ 11 Tuổi 1 Tháng)</text>

      <!-- Metric 2: Delta Gap -->
      <rect x="20" y="135" width="370" height="65" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="35" y="160" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ĐỘ LỆCH TUỔI (DELTA = AI - THỰC TẾ):</text>
      <text x="35" y="187" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">+13.5 Tháng (&gt; 12 Tháng)</text>

      <!-- Alert Box -->
      <rect x="20" y="210" width="370" height="110" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" />
      <text x="35" y="235" fill="#be123c" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">⚠️ CẢNH BÁO NGUY CƠ DẬY THÌ SỚM</text>
      <text x="35" y="258" fill="#881337" font-family="'Segoe UI', sans-serif" font-size="11">• Khung xương cốt hóa già hơn tuổi sinh học 1.1 năm.</text>
      <text x="35" y="278" fill="#881337" font-family="'Segoe UI', sans-serif" font-size="11">• Nguy cơ đóng đĩa sụn sớm gây thấp lùn vĩnh viễn.</text>
      <text x="35" y="298" fill="#9f1239" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">👉 Khuyến nghị: Đo nồng độ hormone LH, FSH, Testosterone.</text>

      <!-- Export Report Button -->
      <rect x="20" y="350" width="370" height="50" rx="6" fill="#f0f9ff" stroke="#0284c7" />
      <text x="205" y="380" text-anchor="middle" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">📥 XUẤT PHIẾU KHÁM LÂM SÀNG (PDF / PRINT)</text>
    </g>
  </g>
</svg>
