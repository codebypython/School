<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <!-- Clean Light Blue and White Canvas -->
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="50" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">CORP-01-CV | CLASSICAL COMPUTER VISION PREPROCESSING</text>
  <text x="60" y="85" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Pipeline Chuẩn Hóa Thị Giác Cổ Điển 5 Bước Triệt Tiêu Học Đường Tắt</text>

  <!-- Flow Steps: 5 Steps Horizontal -->
  <!-- Step 0: Raw Input -->
  <g transform="translate(40, 120)">
    <rect width="160" height="340" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <rect x="15" y="15" width="130" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <!-- Hand shape mockup -->
    <path d="M 80,130 C 50,130 50,90 60,65 C 65,50 75,50 78,70 C 82,45 90,45 93,70 C 97,55 105,55 105,75 C 108,80 115,85 110,105 C 105,125 95,130 80,130 Z" fill="#94a3b8" opacity="0.6" />
    <!-- Metallic L text mockup -->
    <rect x="25" y="25" width="16" height="20" fill="#ef4444" opacity="0.9" rx="2" />
    <text x="33" y="39" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">L</text>
    
    <text x="80" y="170" text-anchor="middle" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">ẢNH THÔ (RAW)</text>
    <text x="80" y="195" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Dị Vật &amp; Viền Đen</text>
    <text x="80" y="225" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Viền đen chiếm 35%</text>
    <text x="80" y="245" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Ký tự L/R kim loại</text>
    <text x="80" y="265" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Tương phản sụn kém</text>
    <text x="80" y="310" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">2048 × 2048 px</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <path d="M 205,290 L 225,290" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  <polygon points="225,286 233,290 225,294" fill="#0284c7" />

  <!-- Step 1: CLAHE -->
  <g transform="translate(235, 120)">
    <rect width="170" height="340" rx="8" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
    <circle cx="85" cy="50" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="85" y="56" text-anchor="middle" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">1</text>
    
    <text x="85" y="105" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">CLAHE</text>
    <text x="85" y="125" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Cân Bằng Sáng Cục Bộ</text>

    <rect x="15" y="150" width="140" height="60" rx="4" fill="#ffffff" stroke="#bae6fd" />
    <text x="25" y="172" fill="#0369a1" font-family="'Courier New', monospace" font-size="11">clipLimit = 3.0</text>
    <text x="25" y="195" fill="#0369a1" font-family="'Courier New', monospace" font-size="11">tileGrid = (8, 8)</text>

    <text x="85" y="240" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Không làm cháy ảnh</text>
    <text x="85" y="260" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Nổi rõ khe sụn ngón</text>
    <text x="85" y="280" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Tăng chi tiết xương</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 410,290 L 430,290" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  <polygon points="430,286 438,290 430,294" fill="#0284c7" />

  <!-- Step 2: Gaussian Blur -->
  <g transform="translate(440, 120)">
    <rect width="170" height="340" rx="8" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
    <circle cx="85" cy="50" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="85" y="56" text-anchor="middle" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">2</text>
    
    <text x="85" y="105" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">GAUSS FILTER</text>
    <text x="85" y="125" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Khử Nhiễu Lượng Tử</text>

    <rect x="15" y="150" width="140" height="60" rx="4" fill="#ffffff" stroke="#bae6fd" />
    <text x="25" y="172" fill="#0369a1" font-family="'Courier New', monospace" font-size="11">ksize = (5, 5)</text>
    <text x="25" y="195" fill="#0369a1" font-family="'Courier New', monospace" font-size="11">sigmaX = 1.0</text>

    <text x="85" y="240" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Triệt tiêu nhiễu hạt</text>
    <text x="85" y="260" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Làm mịn nền mô mềm</text>
    <text x="85" y="280" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Chuẩn bị phân ngưỡng</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 615,290 L 635,290" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  <polygon points="635,286 643,290 635,294" fill="#0284c7" />

  <!-- Step 3: Otsu Binarization -->
  <g transform="translate(645, 120)">
    <rect width="170" height="340" rx="8" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
    <circle cx="85" cy="50" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="85" y="56" text-anchor="middle" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">3</text>
    
    <text x="85" y="105" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">OTSU AUTO</text>
    <text x="85" y="125" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Phân Ngưỡng Nhị Phân</text>

    <rect x="15" y="150" width="140" height="60" rx="4" fill="#ffffff" stroke="#bae6fd" />
    <text x="25" y="172" fill="#0369a1" font-family="'Courier New', monospace" font-size="10">cv2.THRESH_OTSU</text>
    <text x="25" y="195" fill="#0369a1" font-family="'Courier New', monospace" font-size="10">Opt. Variance T*</text>

    <text x="85" y="240" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Tách bàn tay vs nền</text>
    <text x="85" y="260" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Tự thích ứng độ sáng</text>
    <text x="85" y="280" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">• Không cần hard-code</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 820,290 L 840,290" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  <polygon points="840,286 848,290 840,294" fill="#0284c7" />

  <!-- Step 4 & 5: Morphology & Bounding Box Crop -->
  <g transform="translate(850, 120)">
    <rect width="310" height="340" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <circle cx="155" cy="50" r="24" fill="#dcfce7" stroke="#059669" stroke-width="2" />
    <text x="155" y="56" text-anchor="middle" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">4 + 5</text>
    
    <text x="155" y="105" text-anchor="middle" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">MORPHOLOGY &amp; CROPPING</text>
    <text x="155" y="125" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Xóa Dị Vật &amp; Cắt Khung 512×512</text>

    <rect x="20" y="150" width="270" height="60" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" />
    <text x="30" y="172" fill="#047857" font-family="'Courier New', monospace" font-size="11">cv2.morphologyEx(MORPH_OPEN)</text>
    <text x="30" y="195" fill="#059669" font-family="'Courier New', monospace" font-size="11">BoundingBox(x,y,w,h) + 2% Pad</text>

    <text x="155" y="240" text-anchor="middle" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">✓ Xóa sạch chữ L/R kim loại</text>
    <text x="155" y="260" text-anchor="middle" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">• Cắt sát bàn tay, giải phóng 35% VRAM</text>
    <text x="155" y="280" text-anchor="middle" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">• Xuất Cache sạch 12.611 ảnh (512×512)</text>
    <text x="155" y="315" text-anchor="middle" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Huấn luyện nhanh gấp 4.2 lần</text>
  </g>

  <!-- Bottom Technical Highlight Banner -->
  <g transform="translate(40, 485)">
    <rect width="1120" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <circle cx="35" cy="47" r="18" fill="#e0f2fe" stroke="#059669" stroke-width="2" />
    <text x="35" y="53" text-anchor="middle" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">🛡️</text>
    <text x="70" y="36" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">GIẢI PHÁP TRIỆT TIÊU HIỆN TƯỢNG HỌC ĐƯỜNG TẮT (SHORTCUT LEARNING PREVENTION):</text>
    <text x="70" y="62" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      Nếu không xóa chữ kim loại L/R và viền đen, mô hình Deep Learning sẽ học "đường tắt" bằng cách tương quan độ chói của chữ kim loại thay vì cấu trúc sụn sinh học. Pipeline 5 bước đảm bảo <tspan fill="#0284c7" font-weight="700">100% dòng gradient</tspan> chỉ hướng vào xương và sụn tiếp hợp.
    </text>
  </g>
</svg>
