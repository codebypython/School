<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <!-- Clean Light Blue and White Canvas -->
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="50" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">CORP-01-CV | SWIN TRANSFORMER V2 SHIFTED WINDOW ATTENTION</text>
  <text x="60" y="85" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Cơ Chế Tự Chú Ý Cửa Sổ Cục Bộ (W-MSA) &amp; Cửa Sổ Trượt (SW-MSA)</text>

  <!-- Left: Layer l (Regular Window Partition) -->
  <g transform="translate(60, 115)">
    <rect width="500" height="425" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
    <text x="30" y="40" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">TẦNG l: LOCAL WINDOW ATTENTION (W-MSA)</text>
    <text x="30" y="62" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">Chia đều ảnh thành 4 cửa sổ độc lập (M × M = 8 × 8 patches)</text>

    <!-- 2x2 Big Window Grid -->
    <g transform="translate(50, 85)">
      <!-- Window 1 -->
      <rect x="0" y="0" width="180" height="130" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="90" y="70" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Window (1, 1)</text>
      <text x="90" y="90" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Tính Attention nội bộ</text>

      <!-- Window 2 -->
      <rect x="200" y="0" width="180" height="130" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="290" y="70" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Window (1, 2)</text>
      <text x="290" y="90" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Tính Attention nội bộ</text>

      <!-- Window 3 -->
      <rect x="0" y="150" width="180" height="130" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="90" y="220" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Window (2, 1)</text>
      <text x="90" y="240" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Vùng cổ tay</text>

      <!-- Window 4 -->
      <rect x="200" y="150" width="180" height="130" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="290" y="220" text-anchor="middle" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Window (2, 2)</text>
      <text x="290" y="240" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Vùng ngón tay</text>
    </g>

    <!-- Bottom Benefit -->
    <rect x="30" y="380" width="440" height="30" rx="4" fill="#e0f2fe" />
    <text x="40" y="400" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Độ phức tạp tuyến tính:</text>
    <text x="180" y="400" fill="#0f172a" font-family="'Courier New', monospace" font-size="11">𝒪(M² · H · W) thay vì 𝒪((HW)²)</text>
  </g>

  <!-- Shift Transition Indicator -->
  <g transform="translate(565, 305)">
    <path d="M 5,20 L 55,20" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" />
    <polygon points="55,16 63,20 55,24" fill="#6366f1" />
    <text x="35" y="10" text-anchor="middle" fill="#6366f1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Shift</text>
    <text x="35" y="36" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">⌊M/2⌋</text>
  </g>

  <!-- Right: Layer l+1 (Shifted Window Partition) -->
  <g transform="translate(635, 115)">
    <rect width="505" height="425" rx="10" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="30" y="40" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">TẦNG l+1: SHIFTED WINDOW (SW-MSA)</text>
    <text x="30" y="62" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">Dịch chuyển cửa sổ nửa bước (⌊M/2⌋ = 4 patches) tạo liên kết chéo</text>

    <!-- Shifted Window Grid -->
    <g transform="translate(55, 85)">
      <!-- Main Cross Window in Center -->
      <rect x="70" y="50" width="240" height="180" rx="8" fill="#ede9fe" stroke="#6366f1" stroke-width="2" />
      <text x="190" y="125" text-anchor="middle" fill="#4338ca" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">CỬA SỔ GIAO THOA CHÉO</text>
      <text x="190" y="150" text-anchor="middle" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Liên kết: Xương Cổ Tay ⟷ Khớp Ngón Xa</text>
      <text x="190" y="175" text-anchor="middle" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">✓ Nắm bắt tương quan không gian tầm xa</text>

      <!-- Corner shifted remnants -->
      <rect x="0" y="0" width="60" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <rect x="320" y="0" width="60" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <rect x="0" y="240" width="60" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <rect x="320" y="240" width="60" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    </g>

    <!-- Bottom Benefit -->
    <rect x="30" y="380" width="445" height="30" rx="4" fill="#ede9fe" />
    <text x="40" y="400" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Cơ chế Cyclic Shift + Masking:</text>
    <text x="230" y="400" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Ghép biên không làm tăng số phép tính</text>
  </g>

  <!-- Bottom Comparison Strip -->
  <text x="600" y="585" text-anchor="middle" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
    Swin-T kết hợp <tspan fill="#0284c7" font-weight="700">Patch Size 4×4</tspan> và <tspan fill="#4f46e5" font-weight="700">Window Size 8×8</tspan> đạt vị trí Á quân với <tspan fill="#059669" font-weight="700">Test MAE = 6.37 tháng</tspan> (Độ chính xác an toàn 12m đạt 86.0%).
  </text>
</svg>
