<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="45" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CORP-01-CV | STATE-OF-THE-ART (SOTA) BENCHMARK COMPARISON</text>
  <text x="60" y="80" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Đối Chiếu Trực Tiếp Với Các Công Bố Quốc Tế Gần Nhất (RSNA Dataset)</text>

  <!-- Left Side: Horizontal Bar Chart of MAE (Lower is Better) -->
  <g transform="translate(60, 110)">
    <rect width="660" height="480" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
    <text x="30" y="35" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">TEST MAE ĐỐI ĐẦU (THÁNG) — CÀNG THẤP CÀNG CHÍNH XÁC</text>

    <!-- Reference Line: Radiologist Variability (7.32m) -->
    <line x1="530" y1="52" x2="530" y2="445" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
    <text x="530" y="48" text-anchor="middle" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Ngưỡng 7.32m</text>
    <text x="530" y="465" text-anchor="middle" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Bác sĩ X-quang: 7.32m</text>

    <!-- Bar 1: Radiologists -->
    <g transform="translate(30, 60)">
      <text x="0" y="18" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Đồng thuận Bác sĩ (Halabi 2019)</text>
      <rect x="230" y="2" width="300" height="22" rx="4" fill="#cbd5e1" />
      <text x="520" y="18" text-anchor="end" fill="#0f172a" font-family="'Courier New', monospace" font-size="12" font-weight="700">7.32 m</text>
    </g>

    <!-- Bar 2: Larson 2018 -->
    <g transform="translate(30, 105)">
      <text x="0" y="18" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Larson et al. (Radiology 2018)</text>
      <rect x="230" y="2" width="298" height="22" rx="4" fill="#94a3b8" />
      <text x="520" y="18" text-anchor="end" fill="#0f172a" font-family="'Courier New', monospace" font-size="12" font-weight="700">7.30 m</text>
    </g>

    <!-- Bar 3: Wu 2021 -->
    <g transform="translate(30, 150)">
      <text x="0" y="18" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Wu et al. (CMPB 2021)</text>
      <rect x="230" y="2" width="269" height="22" rx="4" fill="#64748b" />
      <text x="510" y="18" fill="#334155" font-family="'Courier New', monospace" font-size="12">6.60 m</text>
    </g>

    <!-- Bar 4: Kasani 2023 -->
    <g transform="translate(30, 195)">
      <text x="0" y="18" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Kasani et al. (CBM 2023)</text>
      <rect x="230" y="2" width="260" height="22" rx="4" fill="#64748b" />
      <text x="500" y="18" fill="#334155" font-family="'Courier New', monospace" font-size="12">6.38 m</text>
    </g>

    <!-- Bar 5: Pan 2024 -->
    <g transform="translate(30, 240)">
      <text x="0" y="18" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Pan et al. (IEEE JBHI 2024)</text>
      <rect x="230" y="2" width="257" height="22" rx="4" fill="#64748b" />
      <text x="497" y="18" fill="#334155" font-family="'Courier New', monospace" font-size="12">6.30 m</text>
    </g>

    <!-- Separator -->
    <line x1="20" y1="285" x2="640" y2="285" stroke="#bae6fd" stroke-width="1.5" />
    <text x="30" y="305" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">★ CÔNG TRÌNH NGHIÊN CỨU VISIONLAB DUT (2026):</text>

    <!-- Bar 6: ResNet FiLM DUT -->
    <g transform="translate(30, 320)">
      <text x="0" y="18" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">VisionLab M1 (ResNet-50 FiLM)</text>
      <rect x="230" y="2" width="264" height="22" rx="4" fill="#0284c7" />
      <text x="504" y="18" fill="#0284c7" font-family="'Courier New', monospace" font-size="12" font-weight="700">6.47 m</text>
    </g>

    <!-- Bar 7: Swin-T FiLM DUT -->
    <g transform="translate(30, 365)">
      <text x="0" y="18" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">VisionLab M3 (Swin-T FiLM)</text>
      <rect x="230" y="2" width="260" height="22" rx="4" fill="#6366f1" />
      <text x="500" y="18" fill="#4f46e5" font-family="'Courier New', monospace" font-size="12" font-weight="700">6.37 m</text>
    </g>

    <!-- Bar 8: ConvNeXt FiLM DUT (Champion) -->
    <g transform="translate(30, 410)">
      <text x="0" y="18" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">VisionLab M2 (ConvNeXt FiLM)</text>
      <rect x="230" y="0" width="255" height="26" rx="4" fill="#059669" stroke="#047857" stroke-width="1.5" />
      <text x="495" y="18" fill="#ffffff" font-family="'Courier New', monospace" font-size="14" font-weight="800">6.26 m 🏆</text>
    </g>
  </g>

  <!-- Right Side: Key Achievements & Takeaways -->
  <g transform="translate(740, 110)">
    <!-- Card 1 -->
    <rect width="400" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <text x="25" y="35" fill="#047857" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">🏆 PHÁ VỠ KỶ LỤC CÁC MÔ HÌNH ĐƠN LẺ</text>
    <text x="25" y="65" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      Với <tspan fill="#065f46" font-weight="700">MAE = 6.26 tháng (~0.52 năm)</tspan>, ConvNeXt-Tiny kết hợp cơ chế điều biến FiLM chính thức vượt qua:
    </text>
    <text x="25" y="95" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="12">• Vượt công bố mới nhất Pan et al. (2024: 6.30m)</text>
    <text x="25" y="115" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="12">• Vượt Kasani et al. (2023: 6.38m) &amp; Wu et al. (2021: 6.60m)</text>
    <text x="25" y="135" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="12">• Bỏ xa mốc cơ sở Larson et al. (2018: 7.30m)</text>

    <!-- Card 2 -->
    <g transform="translate(0, 165)">
      <rect width="400" height="150" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
      <text x="25" y="35" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">⚡ VƯỢT CHUẨN CHUYÊN GIA Y TẾ</text>
      <text x="25" y="65" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
        Nghiên cứu của Halabi et al. (2019) trên tạp chí <tspan fill="#0284c7">Radiology</tspan> chỉ ra độ lệch chuẩn chẩn đoán giữa các bác sĩ X-quang là <tspan fill="#dc2626" font-weight="700">~7.32 tháng</tspan>.
      </text>
      <rect x="20" y="90" width="360" height="45" rx="6" fill="#ffffff" stroke="#0284c7" />
      <text x="35" y="117" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">
        AI đạt 6.26m: Vượt ngưỡng sai số trung bình của Bác sĩ!
      </text>
    </g>

    <!-- Card 3: Academic Contribution -->
    <g transform="translate(0, 330)">
      <rect width="400" height="150" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />
      <text x="25" y="35" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">GIÁ TRỊ HỌC THUẬT ĐỐI VỚI HỘI ĐỒNG</text>
      <text x="25" y="65" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
        Nghiên cứu đầu tiên tại Việt Nam thực hiện đối đầu tam mã toàn diện (ResNet vs ConvNeXt vs Swin-T) trên cùng tập chuẩn RSNA 12.611 ca với cơ chế FiLM điều biến kênh.
      </text>
      <text x="25" y="125" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">
        ✓ Hoàn toàn đủ điều kiện xuất bản bài báo Q1/Q2 quốc tế.
      </text>
    </g>
  </g>
</svg>
