<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <rect width="1200" height="620" fill="#ffffff" />

  <!-- Header -->
  <text x="60" y="45" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CORP-01-CV | SUBGROUP ACCURACY BREAKDOWN ACROSS 4 DEVELOPMENTAL STAGES</text>
  <text x="60" y="80" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Phân Tích Sai Số MAE Theo 4 Giai Đoạn Phát Triển Sinh Lý Bệnh Nhi</text>

  <!-- Main Comparison Container -->
  <g transform="translate(60, 110)">
    <rect width="1080" height="470" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Group 1: Nhũ nhi (< 3 tuổi) -->
    <g transform="translate(25, 40)">
      <rect width="235" height="390" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="18" y="30" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">1. NHŨ NHI (&lt; 3 TUỔI)</text>
      <text x="18" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">782 ca (6.2%) — Sụn trong suốt</text>

      <!-- Bars -->
      <g transform="translate(18, 80)">
        <text x="0" y="15" fill="#64748b" font-size="11">ResNet-50</text>
        <rect x="0" y="22" width="170" height="24" rx="4" fill="#0284c7" />
        <text x="160" y="39" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.95m</text>

        <text x="0" y="75" fill="#64748b" font-size="11">Swin-T v2</text>
        <rect x="0" y="82" width="165" height="24" rx="4" fill="#6366f1" />
        <text x="155" y="99" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.80m</text>

        <text x="0" y="135" fill="#059669" font-size="11" font-weight="700">ConvNeXt-Tiny</text>
        <rect x="0" y="142" width="158" height="26" rx="4" fill="#059669" />
        <text x="148" y="160" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="800">6.55m 🏆</text>
      </g>

      <line x1="18" y1="280" x2="217" y2="280" stroke="#e2e8f0" />
      <text x="18" y="310" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Đặc thù quang học:</text>
      <text x="18" y="332" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Cổ tay chưa xuất hiện xương</text>
      <text x="18" y="350" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">cản quang; đĩa sụn rất mỏng.</text>
    </g>

    <!-- Group 2: Nhi đồng (3 - 8 tuổi) -->
    <g transform="translate(280, 40)">
      <rect width="235" height="390" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="18" y="30" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">2. NHI ĐỒNG (3 - 8 TUỔI)</text>
      <text x="18" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">2.415 ca (19.1%) — 8 hạt xương nở</text>

      <g transform="translate(18, 80)">
        <text x="0" y="15" fill="#64748b" font-size="11">ResNet-50</text>
        <rect x="0" y="22" width="160" height="24" rx="4" fill="#0284c7" />
        <text x="150" y="39" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.20m</text>

        <text x="0" y="75" fill="#64748b" font-size="11">Swin-T v2</text>
        <rect x="0" y="82" width="155" height="24" rx="4" fill="#6366f1" />
        <text x="145" y="99" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.05m</text>

        <text x="0" y="135" fill="#059669" font-size="11" font-weight="700">ConvNeXt-Tiny</text>
        <rect x="0" y="142" width="150" height="26" rx="4" fill="#059669" />
        <text x="140" y="160" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="800">5.92m 🏆</text>
      </g>

      <line x1="18" y1="280" x2="217" y2="280" stroke="#e2e8f0" />
      <text x="18" y="310" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Đặc thù quang học:</text>
      <text x="18" y="332" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Các hạt xương cổ tay xuất hiện</text>
      <text x="18" y="350" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">tuần tự; MAE thấp nhất toàn dải.</text>
    </g>

    <!-- Group 3: Tiền dậy thì (8 - 12 tuổi) -->
    <g transform="translate(535, 40)">
      <rect width="235" height="390" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <text x="18" y="30" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">3. TIỀN DẬY THÌ (8 - 12T)</text>
      <text x="18" y="52" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="11">4.120 ca (32.7%) — Biến động sụn đỉnh</text>

      <g transform="translate(18, 80)">
        <text x="0" y="15" fill="#64748b" font-size="11">ResNet-50</text>
        <rect x="0" y="22" width="162" height="24" rx="4" fill="#0284c7" />
        <text x="152" y="39" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.35m</text>

        <text x="0" y="75" fill="#64748b" font-size="11">Swin-T v2</text>
        <rect x="0" y="82" width="156" height="24" rx="4" fill="#6366f1" />
        <text x="146" y="99" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.15m</text>

        <text x="0" y="135" fill="#059669" font-size="11" font-weight="700">ConvNeXt-Tiny</text>
        <rect x="0" y="142" width="152" height="26" rx="4" fill="#059669" />
        <text x="142" y="160" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="800">6.10m 🏆</text>
      </g>

      <line x1="18" y1="280" x2="217" y2="280" stroke="#bbf7d0" />
      <text x="18" y="310" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Trọng tâm lâm sàng:</text>
      <text x="18" y="332" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Giai đoạn vàng phát hiện dậy thì</text>
      <text x="18" y="350" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">sớm; đĩa sụn nở rộng tối đa.</text>
    </g>

    <!-- Group 4: Vị thành niên (12 - 19 tuổi) -->
    <g transform="translate(790, 40)">
      <rect width="265" height="390" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" />
      <text x="18" y="30" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">4. VỊ THÀNH NIÊN (12 - 19T)</text>
      <text x="18" y="52" fill="#4338ca" font-family="'Segoe UI', sans-serif" font-size="11">5.294 ca (42.0%) — Đóng kín khe sụn</text>

      <g transform="translate(18, 80)">
        <text x="0" y="15" fill="#64748b" font-size="11">ResNet-50</text>
        <rect x="0" y="22" width="175" height="24" rx="4" fill="#0284c7" />
        <text x="165" y="39" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.62m</text>

        <text x="0" y="75" fill="#64748b" font-size="11">Swin-T v2</text>
        <rect x="0" y="82" width="170" height="24" rx="4" fill="#6366f1" />
        <text x="160" y="99" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="12">6.48m (Á quân)</text>

        <text x="0" y="135" fill="#059669" font-size="11" font-weight="700">ConvNeXt-Tiny</text>
        <rect x="0" y="142" width="165" height="26" rx="4" fill="#059669" />
        <text x="155" y="160" text-anchor="end" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="800">6.42m 🏆</text>
      </g>

      <line x1="18" y1="280" x2="247" y2="280" stroke="#ddd6fe" />
      <text x="18" y="310" fill="#4338ca" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Lợi thế Swin-T phát huy:</text>
      <text x="18" y="332" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Attention cửa sổ trượt bám sát sự</text>
      <text x="18" y="350" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">hợp nhất sụn đốt ngón và cổ tay.</text>
    </g>
  </g>
</svg>
