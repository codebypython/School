! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: TACACSClient (AAA Client & Auth-Proxy)
! Folder: Day4-Lab4-hoan chinh
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname TACACSClient
!
boot-start-marker
boot-end-marker
!
enable secret cisco123
!
username admin privilege 15 secret AdminPass123!
username Administrator privilege 15 secret 123qwe!@#
!
aaa new-model
!
! --- 1. CONSOLE AN TOAN: KHONG BAO GIO BI HOI PASSWORD (CON 0) ---
aaa authentication login CONSOLE_BYPASS none
aaa authorization exec CONSOLE_BYPASS none
!
! --- 2. XAC THUC CHO TELNET VA AUTH-PROXY QUA TACACS+ ---
aaa authentication login default group tacacs+ local
aaa authentication login AUTH_PROXY_LIST group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local
aaa authorization auth-proxy default none
!
aaa session-id common
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
!
! --- 3. CONG FA0/0: NOI SANG INTERNET ROUTER (2.2.2.0/24) ---
interface FastEthernet0/0
 description WAN to Internet (2.2.2.0/24)
 ip address 2.2.2.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
! --- 4. CONG FA0/1: NOI SANG TACACS SERVER MAY AO TRÊN VMNET1 (10.0.0.0/24) ---
interface FastEthernet0/1
 description LAN to TACACS Server VM (10.0.0.0/24)
 ip address 10.0.0.1 255.255.255.0
 ip auth-proxy BANANA_WEB_PROXY
 duplex auto
 speed auto
 no shutdown
!
interface Serial1/0
 no ip address
 shutdown
!
interface Serial1/1
 no ip address
 shutdown
!
interface Serial1/2
 no ip address
 shutdown
!
interface Serial1/3
 no ip address
 shutdown
!
! --- 5. CONG FA2/0: DU PHONG CHO CLIENT LAN (192.168.1.0/24) ---
interface FastEthernet2/0
 description LAN to Banana Clients (192.168.1.0/24)
 ip address 192.168.1.1 255.255.255.0
 ip auth-proxy BANANA_WEB_PROXY
 duplex auto
 speed auto
 no shutdown
!
ip forward-protocol nd
!
! --- 6. DICH VU WEB SERVER CHO AUTH-PROXY ---
ip http server
ip http port 80
ip http authentication aaa login-authentication AUTH_PROXY_LIST
no ip http secure-server
!
ip auth-proxy name BANANA_WEB_PROXY http auth-cache-time 30
!
! --- 7. KHAI BAO TACACS+ SERVER (10.0.0.100) ---
tacacs-server host 10.0.0.100
tacacs-server key ciscobanana123
tacacs-server timeout 5
!
control-plane
!
! --- 8. LINE CONSOLE (VAO THANG DAU NHAC #) ---
line con 0
 login authentication CONSOLE_BYPASS
 authorization exec CONSOLE_BYPASS
 privilege level 15
 exec-timeout 0 0
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
! --- 9. LINE VTY (TELNET BAT BUOC QUA TACACS+) ---
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login authentication default
!
end
