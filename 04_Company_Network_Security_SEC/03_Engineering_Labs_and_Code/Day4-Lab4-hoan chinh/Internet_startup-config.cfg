! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: Internet (Web Server 2.2.2.2)
! ==============================================================================
!
version 12.4
no service password-encryption
hostname Internet
!
interface FastEthernet0/0
 description Connect to Banana Router TACACSClient (Fa0/0)
 ip address 2.2.2.2 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface Loopback0
 description Simulated Public Internet Service
 ip address 8.8.8.8 255.255.255.255
 no shutdown
!
! BẬT DỊCH VỤ WEB HTTP SERVER TRÊN CỔNG 80 ĐỂ PHẢN HỒI CHO TRÌNH DUYỆT
ip http server
ip http port 80
!
! Định tuyến quay ngược về Router Banana
ip route 0.0.0.0 0.0.0.0 2.2.2.1
!
end
