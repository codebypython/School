! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: West
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC - DUT)
! Bài Thực Hành 3: Danh Sách Kiểm Soát Truy Cập Mở Rộng (Extended ACL)
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname West
!
boot-start-marker
boot-end-marker
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- MẠNG LAN 2 (10.10.2.0/24) NỐI VÀO MÁY ẢO WINDOWS SERVER 2003 LAN 2 ---
interface FastEthernet0/0
 description Connect to LAN 2 Server (10.10.2.2/24)
 ip address 10.10.2.1 255.255.255.0
 ! Áp dụng Extended ACL chiều Inbound ngay tại cửa ngõ vào (gần nguồn nhất)
 ip access-group 102 in
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
! --- ĐƯỜNG WAN NỐI SANG ROUTER GATEWAY (192.168.12.0/30) ---
interface Serial1/0
 description WAN link to Gateway Serial1/0
 ip address 192.168.12.1 255.255.255.252
 serial restart-delay 0
 clock rate 2016000
 no shutdown
!
! --- GIAO THỨC ĐỊNH TUYẾN RIPv2 ---
router rip
 version 2
 network 10.0.0.0
 network 192.168.12.0
 no auto-summary
!
! ==============================================================================
! ĐỊNH NGHĨA EXTENDED ACL 102 (CHÍNH SÁCH KIỂM SOÁT TỪ LAN 2)
! Yêu cầu Thầy Lý:
! 1. Cho phép FTP giữa LAN 2 và LAN 3 (cả kênh điều khiển port 21 và dữ liệu port 20)
! 2. Chặn toàn bộ kết nối khác giữa LAN 2 và LAN 3 (Web HTTP port 80, Ping ICMP)
! 3. Cho phép tất cả các kết nối khác (Internet, LAN 1, LAN 4)
! ==============================================================================
access-list 102 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp
access-list 102 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp-data
access-list 102 permit tcp 10.10.2.0 0.0.0.255 eq ftp-data 10.10.3.0 0.0.0.255
access-list 102 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 established
access-list 102 deny   ip 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255
access-list 102 permit ip any any
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
