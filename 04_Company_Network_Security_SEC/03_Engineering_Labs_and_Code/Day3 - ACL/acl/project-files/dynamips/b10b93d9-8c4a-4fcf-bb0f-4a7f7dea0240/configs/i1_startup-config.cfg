!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname West
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Loopback1
 ip address 10.10.1.1 255.255.255.0
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 10.10.2.1 255.255.255.0
 ip access-group ACL_FILTER_LAN2 in
 duplex auto
 speed auto
!
interface Serial1/0
 ip address 172.16.3.1 255.255.255.0
 serial restart-delay 0
 clock rate 2016000
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router rip
 version 2
 network 10.0.0.0
 network 172.16.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip access-list extended ACL_FILTER_LAN2
 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp
 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp-data
 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 gt 1023
 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 established
 deny   ip 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255
 permit ip any any
!
access-list 102 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp
access-list 102 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp-data
access-list 102 permit tcp 10.10.2.0 0.0.0.255 eq ftp-data 10.10.3.0 0.0.0.255
access-list 102 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 established
access-list 102 deny   ip 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255
access-list 102 permit ip any any
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
