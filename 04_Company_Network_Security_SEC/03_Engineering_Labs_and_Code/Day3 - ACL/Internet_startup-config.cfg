! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: Internet
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC - DUT)
! Bài Thực Hành 3: Danh Sách Kiểm Soát Truy Cập Mở Rộng (Extended ACL)
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Internet
!
boot-start-marker
boot-end-marker
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.0
!
interface FastEthernet0/0
 ip address 200.200.200.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
router rip
 version 2
 network 8.0.0.0
 network 200.200.200.0
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
