! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: East
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC - DUT)
! Bài Thực Hành 3: Danh Sách Kiểm Soát Truy Cập Mở Rộng (Extended ACL)
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname East
!
boot-start-marker
boot-end-marker
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- MẠNG LAN 3 (10.10.3.0/24) NỐI VÀO MÁY ẢO WINDOWS SERVER 2003 LAN 3 ---
interface FastEthernet0/0
 description Connect to LAN 3 Server (10.10.3.2/24)
 ip address 10.10.3.1 255.255.255.0
 ! Áp dụng Extended ACL chiều Inbound ngay tại cửa ngõ vào (gần nguồn nhất)
 ip access-group 103 in
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
! --- ĐƯỜNG WAN NỐI SANG ROUTER GATEWAY (192.168.23.0/30) ---
interface Serial1/0
 description WAN link to Gateway Serial1/1
 ip address 192.168.23.1 255.255.255.252
 serial restart-delay 0
 clock rate 2016000
 no shutdown
!
! --- GIAO THỨC ĐỊNH TUYẾN RIPv2 ---
router rip
 version 2
 network 10.0.0.0
 network 192.168.23.0
 no auto-summary
!
! ==============================================================================
! ĐỊNH NGHĨA EXTENDED ACL 103 (CHÍNH SÁCH KIỂM SOÁT TỪ LAN 3)
! ==============================================================================
access-list 103 permit tcp 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255 eq ftp
access-list 103 permit tcp 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255 eq ftp-data
access-list 103 permit tcp 10.10.3.0 0.0.0.255 eq ftp-data 10.10.2.0 0.0.0.255
access-list 103 permit tcp 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255 established
access-list 103 deny   ip 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255
access-list 103 permit ip any any
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
