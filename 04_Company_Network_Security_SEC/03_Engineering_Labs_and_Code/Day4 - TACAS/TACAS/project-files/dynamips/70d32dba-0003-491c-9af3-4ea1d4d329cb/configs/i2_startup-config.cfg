! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: Internet (Giả lập ISP / Internet)
! ==============================================================================
!
version 12.4
no service password-encryption
hostname Internet
!
interface FastEthernet0/0
 description Connect to Banana Router TACACS_Client (Fa1/0)
 ip address 2.2.2.2 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
! Cổng Loopback giả lập địa chỉ Public Internet (Google DNS) để client test ping
interface Loopback0
 description Simulated Public Internet Service
 ip address 8.8.8.8 255.255.255.255
 no shutdown
!
! Định tuyến quay ngược về dải Public của Banana Router
ip route 0.0.0.0 0.0.0.0 2.2.2.1
!
end
