! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: TACACS_Client
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC)
! Dự Án: Triển Khai Hạ Tầng AAA (TACACS+) Cho Doanh Nghiệp Banana Corp
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname TACACS_Client
!
boot-start-marker
boot-end-marker
!
! --- BẢO MẬT HỆ THỐNG & TÀI KHOẢN CỤC BỘ DỰ PHÒNG (TRÁNH LOCKOUT) ---
enable secret 0 cisco123
username admin privilege 15 secret 0 AdminBackupPass!
!
! --- KÍCH HOẠT KIẾN TRÚC BẢO MẬT AAA (AUTHENTICATION, AUTHORIZATION, ACCOUNTING) ---
aaa new-model
!
! --- KHAI BÁO MÁY CHỦ TACACS+ SERVER (WINDOWS SERVER 2003 ACS) ---
tacacs-server host 10.0.0.100
tacacs-server key ciscobanana123
tacacs-server timeout 5
!
! --- CẤU HÌNH XÁC THỰC ĐĂNG NHẬP (AUTHENTICATION) ---
! Ưu tiên xác thực qua TACACS+ Server; nếu Server chết/mất mạng thì tự động fallback về Local
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
!
! --- CẤU HÌNH CẤP QUYỀN THỰC THI LỆNH (AUTHORIZATION) ---
! Phân quyền người dùng khi vào chế độ dòng lệnh (Exec Shell)
aaa authorization exec default group tacacs+ local
aaa authorization network default group tacacs+ local
!
! --- CẤU HÌNH GHI NHẬT KÝ HOẠT ĐỘNG (ACCOUNTING) ---
aaa accounting exec default start-stop group tacacs+
aaa accounting commands 15 default start-stop group tacacs+
!
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- CỔNG FA0/0: NỐI XUỐNG MẠNG CLIENTS NỘI BỘ (192.168.1.0/24) ---
interface FastEthernet0/0
 description Connect to Banana Clients LAN
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 duplex auto
 speed auto
 no shutdown
!
! --- CỔNG FA1/0: NỐI RA MẠNG INTERNET (2.2.2.0/24) ---
interface FastEthernet1/0
 description Connect to Internet / WAN Gateway
 ip address 2.2.2.1 255.255.255.0
 ip nat outside
 duplex auto
 speed auto
 no shutdown
!
! --- CỔNG FA2/1: NỐI VÀO PHÂN VÙNG MÁY CHỦ TACACS_SERVER (10.0.0.0/24) ---
! Lưu ý: Cổng này thuộc module NM-16ESW trên Slot 2
interface FastEthernet2/1
 description Connect to TACACS_Server (Windows Server 2003 ACS)
 no switchport
 ip address 10.0.0.1 255.255.255.0
 ip nat inside
 duplex auto
 speed auto
 no shutdown
!
! --- ĐỊNH TUYẾN & BIÊN DỊCH ĐỊA CHỈ MẠNG (NAT OVERLOAD CHO NHÂN VIÊN RA INTERNET) ---
ip route 0.0.0.0 0.0.0.0 2.2.2.2
!
access-list 1 permit 192.168.1.0 0.0.0.255
ip nat inside source list 1 interface FastEthernet1/0 overload
!
! --- ÁP DỤNG CHÍNH SÁCH AAA LÊN CONSOLE VÀ CÁC ĐƯỜNG TELNET/SSH ---
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login authentication default
!
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
line vty 0 4
 privilege level 15
 logging synchronous
 login authentication default
!
end
