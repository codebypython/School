! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: R1
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC - DUT)
! Bài Thực Hành 1: Xác Thực Giao Thức Định Tuyến (RIPv2, OSPF, EIGRP MD5)
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- THIẾT LẬP KEY CHAIN XÁC THỰC MẬT MÃ MD5 DÙNG CHUNG ---
key chain CAY_KHOA
 key 1
  key-string MatKhau123
!
! --- INTERFACE LOOPBACK 0 (MẠNG LAN 1 NỘI BỘ R1) ---
interface Loopback0
 description LAN 1 Network of R1
 ip address 192.168.1.1 255.255.255.0
!
! --- INTERFACE SERIAL 1/0 (KẾT NỐI WAN LIÊN ROUTER R1 <-> R2) ---
interface Serial1/0
 description WAN link to R2 Serial1/0
 ip address 6.9.6.9 255.255.255.252
 serial restart-delay 0
 clock rate 2016000
 !
 ! [Cấu hình xác thực RIPv2 MD5]
 ip rip authentication mode md5
 ip rip authentication key-chain CAY_KHOA
 !
 ! [Cấu hình xác thực OSPF Area 0 MD5]
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 MatKhau123
 !
 ! [Cấu hình xác thực EIGRP AS 100 MD5]
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 CAY_KHOA
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
! --- TIẾN TRÌNH ĐỊNH TUYẾN RIPv2 ---
router rip
 version 2
 network 6.0.0.0
 network 192.168.1.0
 no auto-summary
!
! --- TIẾN TRÌNH ĐỊNH TUYẾN OSPF AREA 0 ---
router ospf 1
 router-id 192.168.1.1
 log-adjacency-changes
 network 6.9.6.8 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
! --- TIẾN TRÌNH ĐỊNH TUYẾN EIGRP AS 100 ---
router eigrp 100
 network 6.9.6.8 0.0.0.3
 network 192.168.1.0
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
