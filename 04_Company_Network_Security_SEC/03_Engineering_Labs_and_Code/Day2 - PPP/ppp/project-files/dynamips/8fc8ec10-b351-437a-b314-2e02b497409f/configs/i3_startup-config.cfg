! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: CAM
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC - DUT)
! Bài Thực Hành 2: Xác Thực PPP CHAP Mạng WAN Tam Giác 3 Quốc Gia (VN - LAO - CAM)
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CAM
!
boot-start-marker
boot-end-marker
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
!
! --- KHAI BÁO CƠ SỞ DỮ LIỆU TÀI KHOẢN XÁC THỰC CHAP ĐỐI ỨNG ---
username VN password 0 Sinch@u
username LAO password 0 Sinch@u
!
! --- MẠNG LAN NỘI BỘ CAMPUCHIA (172.16.48.0/21) ---
interface FastEthernet0/0
 description LAN Network Cambodia (Max 2046 Hosts)
 ip address 172.16.48.1 255.255.248.0
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
! --- ĐƯỜNG WAN SERIAL NỐI SANG LAO (172.16.56.4/30) ---
interface Serial1/0
 description WAN link to LAO Serial1/1
 ip address 172.16.56.6 255.255.255.252
 encapsulation ppp
 no peer neighbor-route
 serial restart-delay 0
 ppp authentication chap
 no shutdown
!
! --- ĐƯỜNG WAN SERIAL NỐI SANG VIỆT NAM (172.16.56.8/30) ---
interface Serial1/1
 description WAN link to VN Serial1/1
 ip address 172.16.56.9 255.255.255.252
 encapsulation ppp
 no peer neighbor-route
 serial restart-delay 0
 ppp authentication chap
 no shutdown
!
! --- ĐỊNH TUYẾN TOÀN MẠNG VỚI RIPv2 ---
router rip
 version 2
 network 172.16.0.0
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
no cdp log mismatch duplex
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
