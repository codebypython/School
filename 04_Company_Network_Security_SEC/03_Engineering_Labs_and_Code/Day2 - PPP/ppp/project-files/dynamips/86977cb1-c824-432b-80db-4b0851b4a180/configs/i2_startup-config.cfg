! ==============================================================================
! CISCO IOS STARTUP-CONFIG FOR ROUTER: LAO
! Học Phần: An Toàn Mạng & Mật Mã Học Ứng Dụng (CORP-04-SEC - DUT)
! Bài Thực Hành 2: Xác Thực PPP CHAP Mạng WAN Tam Giác 3 Quốc Gia (VN - LAO - CAM)
! ==============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname LAO
!
boot-start-marker
boot-end-marker
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
no ip domain lookup
multilink bundle-name authenticated
!
! --- KHAI BÁO CƠ SỞ DỮ LIỆU TÀI KHOẢN XÁC THỰC CHAP ĐỐI ỨNG ---
username VN password 0 Sinch@u
username CAM password 0 Sinch@u
!
! --- MẠNG LAN NỘI BỘ LÀO (172.16.32.0/20) ---
interface FastEthernet0/0
 description LAN Network Laos (Max 4094 Hosts)
 ip address 172.16.32.1 255.255.240.0
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
! --- ĐƯỜNG WAN SERIAL NỐI SANG VN (172.16.56.0/30) ---
interface Serial1/0
 description WAN link to VN Serial1/0
 ip address 172.16.56.2 255.255.255.252
 encapsulation ppp
 no peer neighbor-route
 serial restart-delay 0
 ppp authentication chap
 no shutdown
!
! --- ĐƯỜNG WAN SERIAL NỐI SANG CAMPUCHIA (172.16.56.4/30) ---
interface Serial1/1
 description WAN link to CAM Serial1/0
 ip address 172.16.56.5 255.255.255.252
 encapsulation ppp
 no peer neighbor-route
 serial restart-delay 0
 clock rate 2016000
 ppp authentication chap
 no shutdown
!
! --- ĐỊNH TUYẾN TOÀN MẠNG VỚI RIPv2 ---
router rip
 version 2
 network 172.16.0.0
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
no cdp log mismatch duplex
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
end
